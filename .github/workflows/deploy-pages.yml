name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/mansalau-hike-webapp-gcgk63
  # Rebuild + redeploy every 6h so fresh trek news reaches the live site.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest trek news
        # Generates public/news.json so the build bundles current headlines.
        # Non-fatal: if the fetch fails, the committed news.json is used instead.
        continue-on-error: true
        run: node scripts/fetch-news.mjs

      - name: Build
        # Supabase config comes from repo Variables (Settings -> Secrets and
        # variables -> Actions -> Variables). Safe to expose: the anon key is public
        # and Row Level Security protects the data. Leave them unset to build the
        # offline-only version.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
